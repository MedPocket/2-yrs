<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="50" fill="#0f172a"/>
  <text x="400" y="32" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">QUY TRÌNH TẦM SOÁT QUÝ I &amp; TỶ LỆ sFlt-1/PlGF TRONG CHẨN ĐOÁN</text>

  <!-- Left: First Trimester Screening (FIGO) -->
  <rect x="20" y="70" width="370" height="390" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="20" y="70" width="370" height="40" rx="8" fill="#dbeafe"/>
  <text x="205" y="96" fill="#1e40af" font-size="15" font-weight="bold" text-anchor="middle">1. Tầm soát Quý I (Tuần 11 - 13⁺⁶) - Khuyên dùng FIGO</text>

  <g transform="translate(35, 125)">
    <rect x="0" y="0" width="340" height="48" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="15" y="20" fill="#0f172a" font-size="13" font-weight="bold">Yếu tố mẹ (Maternal Factors):</text>
    <text x="15" y="38" fill="#475569" font-size="12">Tuổi, BMI, Chủng tộc, Tiền sử THA/TSG, Đái tháo đường, Mầm bệnh tự miễn</text>
  </g>

  <g transform="translate(35, 183)">
    <rect x="0" y="0" width="340" height="48" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="15" y="20" fill="#0f172a" font-size="13" font-weight="bold">Huyết áp động mạch trung bình (MAP):</text>
    <text x="15" y="38" fill="#475569" font-size="12">Đo chuẩn hóa 2 bên tay bằng máy đo tự động đã kiểm định</text>
  </g>

  <g transform="translate(35, 241)">
    <rect x="0" y="0" width="340" height="48" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="15" y="20" fill="#0f172a" font-size="13" font-weight="bold">Siêu âm Doppler ĐM Tử cung (UtAD-PI):</text>
    <text x="15" y="38" fill="#475569" font-size="12">Tính chỉ số xung bình quân hai bên (Mean UtAD-PI)</text>
  </g>

  <g transform="translate(35, 299)">
    <rect x="0" y="0" width="340" height="48" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="15" y="20" fill="#0f172a" font-size="13" font-weight="bold">Sinh hóa máu mẹ (Biomarkers):</text>
    <text x="15" y="38" fill="#475569" font-size="12">Nồng độ Yếu tố tăng trưởng bánh nhau (PlGF) và/hoặc PAPP-A</text>
  </g>

  <g transform="translate(35, 357)">
    <rect x="0" y="0" width="340" height="88" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="170" y="22" fill="#991b1b" font-size="13" font-weight="bold" text-anchor="middle">Kết quả thuật toán FMF / FIGO:</text>
    <text x="15" y="44" fill="#991b1b" font-size="12" font-weight="bold">• Nguy cơ cao (≥ 1/100):</text>
    <text x="30" y="62" fill="#7f1d1d" font-size="12">Chỉ định Aspirin 150 mg/đêm từ trước tuần 16 đến 36 tuần.</text>
    <text x="15" y="80" fill="#166534" font-size="12" font-weight="bold">• Nguy cơ thấp (&lt; 1/100):</text>
    <text x="165" y="80" fill="#166534" font-size="12">Chăm sóc thai kỳ định kỳ chuẩn.</text>
  </g>

  <!-- Right: sFlt-1 / PlGF Ratio Utility -->
  <rect x="410" y="70" width="370" height="390" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="410" y="70" width="370" height="40" rx="8" fill="#dcfce7"/>
  <text x="595" y="96" fill="#15803d" font-size="15" font-weight="bold" text-anchor="middle">2. Tỷ lệ sFlt-1 / PlGF (Thai nghi ngờ TSG)</text>

  <g transform="translate(425, 125)">
    <rect x="0" y="0" width="340" height="95" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <text x="15" y="22" fill="#166534" font-size="14" font-weight="bold">Ngưỡng sFlt-1 / PlGF ≤ 38:</text>
    <text x="15" y="44" fill="#14532d" font-size="13" font-weight="bold">LOẠI TRỪ TIỀN SẢN GIẬT</text>
    <text x="15" y="64" fill="#334155" font-size="12">• Giá trị tiên đoán âm (NPV) &gt; 99% trong vòng 1 tuần.</text>
    <text x="15" y="82" fill="#334155" font-size="12">• NPV &gt; 94% loại trừ xuất hiện TSG trong 4 tuần.</text>
  </g>

  <g transform="translate(425, 235)">
    <rect x="0" y="0" width="340" height="105" rx="6" fill="#fffbebe" stroke="#fcd34d"/>
    <text x="15" y="22" fill="#92400e" font-size="14" font-weight="bold">Ngưỡng sFlt-1 / PlGF &gt; 38 đến 85/110:</text>
    <text x="15" y="44" fill="#78350f" font-size="13" font-weight="bold">NGUY CƠ TRUNG BÌNH / THEO DÕI SÁT</text>
    <text x="15" y="64" fill="#334155" font-size="12">• Cần theo dõi chặt chẽ triệu chứng lâm sàng, HA, niệu.</text>
    <text x="15" y="82" fill="#334155" font-size="12">• Đánh giá lại xét nghiệm sinh hóa/xung ĐM tử cung.</text>
    <text x="15" y="98" fill="#334155" font-size="12">• Cân nhắc lặp lại sFlt-1/PlGF sau 1 - 2 tuần.</text>
  </g>

  <g transform="translate(425, 355)">
    <rect x="0" y="0" width="340" height="90" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="15" y="22" fill="#991b1b" font-size="14" font-weight="bold">Ngưỡng &gt; 85 (&lt; 34 tuần) hoặc &gt; 110 (≥ 34 tuần):</text>
    <text x="15" y="44" fill="#7f1d1d" font-size="13" font-weight="bold">NGUY CƠ CỰC CAO / HỖ TRỢ CHẨN ĐOÁN</text>
    <text x="15" y="64" fill="#334155" font-size="12">• Tiên đoán nguy cơ cao biến chứng cấp ở mẹ/thai.</text>
    <text x="15" y="82" fill="#334155" font-size="12">• Chỉ định nhập viện, hội chẩn chuyên khoa Sản.</text>
  </g>
</svg>